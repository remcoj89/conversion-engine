<title>Westend Digital — Conversion Engine | UX-wireframes v0.3</title>
<style>
:root{--bg:#f6f7f9;--paper:#fff;--ink:#18252e;--muted:#68747e;--line:#dfe5e9;--accent:#225a72;--soft:#eaf2f5;--danger:#a23a33;--ok:#2b6b50;--warn:#8c5e22;--r:12px;font-family:Inter,Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}.brand{padding:0 12px 12px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px;letter-spacing:-.5px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.08em}.navgroup{display:grid;gap:5px}.nav button{border:0;background:transparent;width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:8px;color:#49565e;font-weight:600}.nav button:hover,.nav button.active{background:var(--soft);color:#153b4e}.nav button .n{font-size:16px;width:20px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px;display:grid;gap:8px}.sidefoot select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:white}.sidefoot .hint{font-size:11px;color:var(--muted)}.main{flex:1;min-width:0}.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:18px}.heading{font-size:22px;font-weight:750;letter-spacing:-.4px}.header small{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center}.content{max-width:1250px;margin:0 auto;padding:28px 30px 60px}.section{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:26px 0 13px}.section:first-child{margin-top:0}.section h2{font-size:16px;margin:0}.section p{font-size:12px;margin:5px 0 0;color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:var(--r);padding:17px;min-width:0}.metric{font-size:27px;font-weight:800;margin:7px 0}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.btn{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:8px;padding:9px 13px;font-weight:650}.btn:hover{filter:brightness(.94)}.btn.secondary{background:white;color:#24495d;border-color:#bfced5}.btn.ghost{background:transparent;color:#24556c;border-color:transparent}.btn.danger{background:white;color:var(--danger);border-color:#e6c8c6}.btn:disabled{opacity:.45;cursor:not-allowed}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;background:#edf1f3;color:#58656e;font-size:11px;font-weight:700;white-space:nowrap}.tag.warn{background:#fff4de;color:#865b1d}.tag.ok{background:#eaf6ed;color:#226747}.tag.bad{background:#ffedeb;color:#943932}.tag.info{background:#e9f2f9;color:#235b7f}.linkbtn{background:none;border:0;padding:0;color:#1d526f;font-weight:700;text-align:left}.linkbtn:hover{text-decoration:underline}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:var(--r)}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 15px;border-bottom:1px solid #edf0f2;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;background:#fafbfc}tr:last-child td{border-bottom:0}tr:hover td{background:#fbfcfd}input,select,textarea{background:white;border:1px solid #cdd7dc;border-radius:8px;padding:10px 11px;color:var(--ink);max-width:100%}label{display:block;font-size:12px;font-weight:700;color:#52616d;margin-bottom:7px}.field{display:grid;gap:4px}.alert{padding:13px 15px;border:1px solid #e6d6b9;background:#fff9ea;border-radius:9px;font-size:12px;color:#76511f}.well{background:#f6f9fa;padding:14px;border:1px solid #e0e8ed;border-radius:9px}.timeline{border-left:2px solid #d8e4e9;margin:15px 0 0 7px;padding-left:20px;display:grid;gap:17px}.timeline .ev{position:relative}.timeline .ev:before{content:"";position:absolute;left:-26px;top:3px;width:10px;height:10px;border-radius:50%;background:#adc2cc;border:2px solid white}.ev b{display:block;margin-bottom:3px}.timeline .date{font-size:11px;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:10px}.pipe{border:1px solid var(--line);border-radius:10px;background:#eef2f4;min-height:280px;padding:10px}.pipeheader{display:flex;justify-content:space-between;padding:4px 3px 12px;font-size:12px;font-weight:800}.deal{padding:13px;background:white;border:1px solid #dae2e7;border-radius:9px;margin-bottom:9px}.deal .name{font-weight:750;margin-bottom:6px}.deal .money{margin-top:11px;font-size:12px;color:#426174;font-weight:750}.bar{height:7px;background:#e7edf1;border-radius:10px;overflow:hidden}.bar>span{display:block;background:#476f83;height:100%;border-radius:10px}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.empty h3{color:var(--ink);margin:0 0 8px}.panels{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(290px,.9fr);gap:16px}.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.statusrow{padding:12px;background:#f8fafb;border:1px solid #e5eaed;border-radius:8px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{color:#586974;font-size:12px;line-height:1.6}.mobilebar{display:none}.wide{width:100%}.stack{display:grid;gap:12px}.clickable{cursor:pointer}.clickable:hover{border-color:#b9cbd3;box-shadow:0 3px 12px #25384a0e}@media(max-width:1060px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}.panels{grid-template-columns:1fr}.side{width:210px}.header{padding:0 20px}.content{padding:24px 20px}}@media(max-width:720px){.app{display:block}.side{height:auto;position:static;width:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:0}.brand{border:0;padding:6px 4px;font-size:16px}.side .navgroup,.sidefoot{display:none}.mobilebar{display:flex;gap:5px;overflow:auto;padding:10px 0 3px}.mobilebar button{white-space:nowrap;font-size:12px;padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:7px}.mobilebar button.active{background:var(--soft);color:#225a72}.header{height:auto;padding:16px;align-items:flex-start}.heading{font-size:20px}.content{padding:16px}.two,.three,.four,.formrow{grid-template-columns:1fr}.section{align-items:flex-start;flex-direction:column}.tablewrap{overflow-x:auto}table{min-width:570px}.pipeline{grid-template-columns:repeat(5,220px)}.toolbar{flex-wrap:wrap}.btn{padding:8px 10px}.card{padding:14px}}

/* Responsive improvements in wireframe v0.3: usable cards rather than clipped tables. */
.mobileMenuToggle,.mobile-role,.mobile-pipeline{display:none}
.mobile-deal{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px;display:grid;gap:5px;color:var(--ink)}
.mobile-phase{margin-bottom:15px}
.mobile-phase h3{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 8px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #62a6c3;outline-offset:2px}
@media(max-width:720px){
.mobileMenuToggle{display:block;margin:7px 4px;width:calc(100% - 8px);padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#225a72;text-align:left;font-weight:700}
.mobilebar{display:none;overflow:visible;flex-direction:column;gap:6px;padding:7px 3px 10px}
.mobilebar.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.mobilebar button{white-space:normal;text-align:left;min-height:42px}
.mobile-role{display:none;padding:8px 5px 12px}.mobile-role.open{display:block}.mobile-role select{width:100%}.mobile-role .hint{font-size:11px;color:var(--muted)}
.tablewrap{overflow:visible;background:transparent;border:0}
.tablewrap table{min-width:0;width:100%;display:block}
.tablewrap thead{display:none}
.tablewrap tbody{display:grid;gap:9px}
.tablewrap tbody tr{display:block;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.tablewrap tbody tr td{display:flex;padding:9px 12px;border-bottom:1px solid #edf0f2;justify-content:space-between;gap:14px;text-align:right;word-break:break-word}
.tablewrap tbody tr td:last-child{border-bottom:0;justify-content:flex-end}
.tablewrap tbody tr td:first-child{display:block;text-align:left;padding:12px}
.tablewrap td::before{font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:650;white-space:nowrap;text-align:left}
.attention-table td:nth-child(2)::before{content:'Aanvraag'}
.attention-table td:nth-child(3)::before{content:'Status'}
.leads-table td:nth-child(2)::before{content:'Interesse'}
.leads-table td:nth-child(3)::before{content:'Bron'}
.leads-table td:nth-child(4)::before{content:'Eigenaar'}
.leads-table td:nth-child(5)::before{content:'Status'}
.tablewrap tbody tr td[colspan]{display:block;text-align:center}
.pipeline{display:none}
.mobile-pipeline{display:block}
.row{min-width:0}
}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">westend<span style="color:#758994">.</span><small>CONVERSION ENGINE · WIREFRAME</small></div><button class="mobileMenuToggle" id="mobileMenuToggle" aria-expanded="false" aria-controls="mobileNav">☰ Menu en schermen</button><nav class="nav navgroup" id="nav"></nav><div class="mobilebar" id="mobileNav"></div><div class="mobile-role" id="mobileRole"><label for="roleMobile">Test gebruikersrol</label><select id="roleMobile"><option value="owner">Business Owner</option><option value="team">Team Member</option></select><p class="hint">Interactieve demo met fictieve gegevens; geen backend.</p></div><div class="sidefoot"><label for="role">Voorbeeldrol</label><select id="role"><option value="owner">Business Owner</option><option value="team">Team Member</option></select><div class="hint">Demo zonder backend. Wijzigingen zijn tijdelijk en gebruiken fictieve gegevens.</div><button class="btn secondary" id="reset">Demo resetten</button></div></aside><div class="main"><header class="header"><div><div class="heading" id="pageTitle">Overzicht</div><small>Fictieve organisatie: NoordFit Coaching · Wireframe v0.3</small></div><div class="toolbar"><span class="tag info">Prototype</span><button class="btn secondary" data-nav="support">Support aanvragen</button></div></header><main id="view" class="content"></main></div></div>
<script>
(()=>{'use strict';
const data0=()=>({leads:[{id:101,name:'Mark de Vries',email:'mark@example.test',source:'Fitnessquiz',interest:'Personal training',status:'action',owner:'Eigenaar',created:'Vandaag, 09:18',ai:'sent',replied:false,hasDeal:true,timeline:[['09:18','Aanvraag ontvangen','Websitequiz afgerond, interesse in personal training.'],['09:19','AI-reactie verzonden','Vervolgvraag en boekingslink verstuurd.']]},{id:102,name:'Lisa Bakker',email:'lisa@example.test',source:'Contactformulier',interest:'Kennismaking',status:'appointment',owner:'Eigenaar',created:'Gisteren, 16:05',ai:'sent',replied:false,hasDeal:true,timeline:[['16:05','Aanvraag ontvangen','Contactformulier ontvangen.'],['16:10','Afspraak bevestigd','Boekingsprovider bevestigde woensdag 15:00.']]},{id:103,name:'Sam Janssen',email:'sam@example.test',source:'Calculator',interest:'Coaching',status:'human',owner:'Medewerker',created:'Vandaag, 10:42',ai:'failed',replied:false,hasDeal:false,timeline:[['10:42','Aanvraag ontvangen','Calculator-resultaat: 3 trainingsdagen.'],['10:43','AI-reactie mislukt','Bericht niet verzonden; handmatige opvolging vereist.']]},{id:104,name:'Alex Smit',email:'alex@example.test',source:'Download',interest:'Trainingsschema',status:'new',owner:'Medewerker',created:'Gisteren, 11:24',ai:'none',replied:false,hasDeal:false,timeline:[['11:24','Gids aangevraagd','Gids afgeleverd. Geen verkoopintentie vastgesteld.']]}],deals:[{id:201,lead:101,name:'12 weken coaching — Mark',phase:'Nieuw',value:900,owner:'Eigenaar',recieved:0},{id:202,lead:102,name:'Personal training — Lisa',phase:'Afspraak',value:1200,owner:'Eigenaar',recieved:0},{id:203,lead:null,name:'Bootcamp — Robin',phase:'Voorstel',value:450,owner:'Medewerker',recieved:0},{id:204,lead:null,name:'Groepsles — Kim',phase:'Gewonnen',value:600,owner:'Eigenaar',recieved:150}],tasks:[{id:301,lead:101,text:'Bel Mark over trainingsdoelen',owner:'Eigenaar',date:'Vandaag',done:false},{id:302,lead:103,text:'Neem Sam handmatig over: AI-verzending mislukt',owner:'Medewerker',date:'Vandaag',done:false},{id:303,lead:102,text:'Bereid intake met Lisa voor',owner:'Eigenaar',date:'Morgen',done:false}]});
let db=data0(),state={page:'overview',leadId:101,dealId:201,filter:'action',role:'owner'};
const nav=[['overview','▦','Overzicht'],['leads','☷','Leads & contacten'],['pipeline','▥','Pipeline'],['tasks','✓','Taken & afspraken'],['results','▤','Resultaten'],['settings','⚙','Instellingen'],['support','?','Support aanvragen']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isTeam=()=>state.role==='team';const mine=l=>!isTeam()||l.owner==='Medewerker';const allowedLead=()=>db.leads.filter(mine);const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);const tag=(s,cls='')=>`<span class="tag ${cls}">${s}</span>`;const button=(label,act,cls='secondary')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;
const statusLabel={action:'Actie nodig',appointment:'Afspraak gepland',human:'Handmatig behandelen',new:'Nieuw',done:'Afgehandeld'};const statusBadge=l=>tag(statusLabel[l.status],l.status==='human'?'bad':l.status==='action'?'warn':l.status==='appointment'?'ok':'');
function go(page,arg){state.page=page;if(page==='lead')state.leadId=Number(arg);if(page==='deal')state.dealId=Number(arg);render();window.scrollTo(0,0)}
function renderNav(){let n=nav.filter(x=>!isTeam()||!['results','settings'].includes(x[0]));const html=n.map(x=>`<button class="${state.page===x[0]||state.page==='lead'&&x[0]==='leads'||state.page==='deal'&&x[0]==='pipeline'?'active':''}" data-nav="${x[0]}"><span class="n">${x[1]}</span>${x[2]}</button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=n.map(x=>`<button class="${state.page===x[0]?'active':''}" data-nav="${x[0]}">${x[2]}</button>`).join('');}
const sec=(title,desc='',right='')=>`<div class="section"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${right}</div>`;
function overview(){const leads=allowedLead(),attention=leads.filter(l=>['action','human'].includes(l.status)),tasks=db.tasks.filter(t=>!t.done&&(!isTeam()||t.owner==='Medewerker'));return `${sec('Actie vereist','Pak de belangrijkste openstaande aanvragen en taken eerst op.')}
<div class="grid three"><div class="card clickable" data-nav="leads"><div class="muted small">Leads die aandacht vragen</div><div class="metric">${attention.length}</div>${tag('Open aanvragen','warn')}</div><div class="card clickable" data-nav="tasks"><div class="muted small">Open taken</div><div class="metric">${tasks.length}</div>${tag('Persoonlijke opvolging')}</div><div class="card"><div class="muted small">Bevestigde afspraken</div><div class="metric">1</div>${tag('Volgens boekingsprovider','ok')}</div></div>
${sec('Direct opvolgen','Gesorteerd op benodigde actie.',button('Alle aanvragen bekijken','openleads'))}
<div class="tablewrap"><table class="attention-table"><thead><tr><th>Contact</th><th>Aanvraag</th><th>Status</th><th>Actie</th></tr></thead><tbody>${attention.map(l=>`<tr><td><strong>${esc(l.name)}</strong><div class="small muted">${esc(l.created)}</div></td><td>${esc(l.interest)}</td><td>${statusBadge(l)}</td><td><button class="linkbtn" data-lead="${l.id}">Open lead →</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Geen open opvolgacties.</td></tr>'}</tbody></table></div>
${sec('Commercieel overzicht','Deze cijfers zijn demonstratiegegevens.')}
<div class="grid ${isTeam()?'two':'four'}"><div class="card"><div class="muted small">Aanvragen</div><div class="metric">${isTeam()?allowedLead().length:38}</div></div><div class="card"><div class="muted small">Bevestigde afspraken</div><div class="metric">${isTeam()?allowedLead().filter(l=>l.status==='appointment').length:15}</div></div>${!isTeam()?'<div class="card"><div class="muted small">Gewonnen deals</div><div class="metric">7</div></div><div class="card"><div class="muted small">Ontvangsten (handmatig)</div><div class="metric">€ 2.450</div></div>':''}</div>
${sec('Websitegezondheid','Frontendcontrole en volledige ketentest worden apart beoordeeld.')}
<div class="card statusgrid"><div class="statusrow">${tag('Geslaagd','ok')} <strong>Frontendformulier</strong><div class="small muted" style="margin-top:6px">30 minuten-interval · zonder backendverzending</div></div><div class="statusrow">${tag('Geslaagd','ok')} <strong>Ketencontrole</strong><div class="small muted" style="margin-top:6px">Laatst geverifieerd: 2 dagen geleden · geen AI-verwerking</div></div></div>`}
function leads(){let arr=allowedLead().filter(l=>state.filter==='all'||(state.filter==='action'?['action','human'].includes(l.status):l.status===state.filter));let f=[['action','Actie nodig'],['all','Alle'],['appointment','Afspraak'],['new','Nieuw'],['done','Afgehandeld']];return `${sec('Aanvragen','Iedere aanvraag blijft traceerbaar; AI-status en opvolgstatus zijn afzonderlijk.',`<div class="row"><input id="searchLeads" placeholder="Zoek naam / dienst" aria-label="Zoek leads" style="width:210px"></div>`)}<div class="row" style="flex-wrap:wrap;margin-bottom:13px">${f.map(x=>`<button class="btn ${state.filter===x[0]?'':'secondary'}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="tablewrap"><table class="leads-table"><thead><tr><th>Contact</th><th>Interesse</th><th>Bron</th><th>Toegewezen aan</th><th>Status</th><th></th></tr></thead><tbody id="leadRows">${arr.map(l=>leadRow(l)).join('')||'<tr><td colspan="6" class="empty">Geen aanvragen in dit filter.</td></tr>'}</tbody></table></div><p class="note">Contacten en aanvragen zijn verschillende records: één contact kan meerdere aanvragen en deals hebben.</p>`}
function leadRow(l){return `<tr data-text="${esc((l.name+' '+l.interest).toLowerCase())}"><td><strong>${esc(l.name)}</strong><div class="muted tiny">${esc(l.created)}</div></td><td>${esc(l.interest)}</td><td>${esc(l.source)}</td><td>${esc(l.owner)}</td><td>${statusBadge(l)}</td><td><button class="linkbtn" data-lead="${l.id}">Open →</button></td></tr>`}
function leadDetail(){let l=db.leads.find(l=>l.id===state.leadId);if(!l||!mine(l))return `<div class="alert">Geen toegang tot deze aanvraag.</div>`;let d=db.deals.find(d=>d.lead===l.id);return `<div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:16px"><button class="linkbtn" data-nav="leads">← Terug naar leads</button><div class="row">${button('Neem over','takeover','secondary')}${button('Maak taak','newtask','secondary')}${!d?button('Maak deal','newdeal',''):button('Bekijk deal','viewdeal','')}</div></div><div class="grid two"><div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0 0 4px">${esc(l.name)}</h2><span class="muted small">${esc(l.email)}</span></div>${statusBadge(l)}</div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><div class="grid two"><div><div class="muted small">Interesse</div><strong>${esc(l.interest)}</strong></div><div><div class="muted small">Leadbron</div><strong>${esc(l.source)}</strong></div><div><div class="muted small">Eigenaar</div><strong>${esc(l.owner)}</strong></div><div><div class="muted small">Marketingtoestemming</div><strong>Niet vastgesteld</strong></div></div><div class="well" style="margin-top:17px"><strong>Volgende actie</strong><p class="note" style="margin-bottom:0">${l.status==='human'?'Automatische verzending is mislukt. Neem contact handmatig over.':l.status==='appointment'?'Afspraak is bevestigd. Bereid het gesprek voor.':l.status==='done'?'Deze aanvraag is afgehandeld.':'Controleer of de lead persoonlijk opvolging nodig heeft.'}</p></div></div><div class="card"><h2 style="font-size:16px;margin-top:0">AI & opvolging</h2><div class="statusgrid"><div class="statusrow"><div class="muted tiny">AI-status</div>${tag(l.ai==='sent'?'Eerste reactie verzonden':l.ai==='failed'?'Verzending mislukt':'Niet gestart',l.ai==='sent'?'ok':l.ai==='failed'?'bad':'')}</div><div class="statusrow"><div class="muted tiny">Automatische reminder</div>${tag(l.status==='appointment'||l.status==='done'?'Gestopt':l.status==='human'?'Uitgeschakeld':'Voorwaardelijk',l.status==='appointment'?'ok':'')}</div></div><p class="note">Een getoonde Calendly-link is nog geen geboekte afspraak. De boekingsprovider moet de afspraak bevestigen.</p><hr style="border:0;border-top:1px solid var(--line)"><h3 style="font-size:14px">Tijdlijn</h3><div class="timeline">${l.timeline.map(ev=>`<div class="ev"><span class="date">${esc(ev[0])}</span><b>${esc(ev[1])}</b><span class="small muted">${esc(ev[2])}</span></div>`).join('')}</div></div></div>`}
const phases=['Nieuw','Gekwalificeerd','Afspraak','Voorstel','Gewonnen'];
function pipeline(){const deals=db.deals.filter(d=>!isTeam()||d.owner==='Medewerker');return `${sec('Sales pipeline','Standaardfasen per branchetemplate. Verplaats deals vanuit het dealvenster.',tag('Geen pipelinebuilder in MVP'))}<div class="pipeline">${phases.map(p=>{let ds=deals.filter(d=>d.phase===p);return `<div class="pipe"><div class="pipeheader"><span>${p}</span>${tag(ds.length)}</div>${ds.map(d=>`<div class="deal clickable" data-deal="${d.id}"><div class="name">${esc(d.name)}</div><div class="muted tiny">Eigenaar: ${esc(d.owner)}</div>${!isTeam()?`<div class="money">${money(d.value)}</div>`:''}<div style="margin-top:10px"><button class="linkbtn" data-deal="${d.id}">Bekijk deal →</button></div></div>`).join('')||'<div class="muted small" style="padding:10px">Geen deals</div>'}</div>`}).join('')}</div><div class="mobile-pipeline">${phases.map(p=>{const ds=deals.filter(d=>d.phase===p);return `<section class="mobile-phase"><h3>${p} <span class="tag">${ds.length}</span></h3>${ds.map(d=>`<button class="mobile-deal" data-deal="${d.id}"><strong>${esc(d.name)}</strong><span class="muted small">${esc(d.owner)}${!isTeam()?' · '+money(d.value):''}</span><span class="small" style="color:#225a72">Open deal →</span></button>`).join('')||'<p class="muted small">Geen deals in deze fase.</p>'}</section>`}).join('')}</div><p class="note">De desktop heeft kanban-kolommen; op mobiel worden deals per fase in een verticale lijst getoond.</p>`}
function dealDetail(){let d=db.deals.find(d=>d.id===state.dealId);if(!d||isTeam()&&d.owner!=='Medewerker')return '<div class="alert">Geen toegang tot deze deal.</div>';return `<button class="linkbtn" data-nav="pipeline">← Terug naar pipeline</button><div class="grid two" style="margin-top:16px"><div class="card"><h2>${esc(d.name)}</h2><div class="field"><label for="phase">Pipelinefase</label><select id="phase">${phases.map(p=>`<option ${p===d.phase?'selected':''}>${p}</option>`).join('')}<option ${d.phase==='Verloren'?'selected':''}>Verloren</option></select></div><p class="note">Statuswijzigingen worden vastgelegd als activiteit. Een bevestigde afspraak is een afzonderlijke gebeurtenis.</p><div class="row">${button('Sla fase op','savephase','')}</div></div>${!isTeam()?`<div class="card"><h2>Contract en betalingen</h2><div class="grid two"><div><div class="muted small">Contractwaarde</div><div class="metric">${money(d.value)}</div></div><div><div class="muted small">Ontvangen</div><div class="metric">${money(d.recieved)}</div></div></div><div class="well small">Resterende contractwaarde: <b>${money(d.value-d.recieved)}</b>. Dit is geen openstaande factuur.</div><div class="formrow" style="margin-top:13px"><div class="field"><label for="payment">Ontvangen betaling (€)</label><input id="payment" type="number" min="1" step="1" placeholder="Bijv. 150"></div><div class="field"><label for="paymentDate">Datum</label><input id="paymentDate" type="date" value="2026-10-17"></div></div><div style="margin-top:12px">${button('Registreer betaling','payment','')}</div></div>`:'<div class="card"><h2>Toewijzing</h2><p class="note">Financiële details zijn verborgen voor Team Members.</p></div>'}</div>`}
function tasks(){let tasks=db.tasks.filter(t=>!isTeam()||t.owner==='Medewerker');return `${sec('Taken & afspraken','Vervolgacties worden gekoppeld aan een verantwoordelijke.')}${tasks.map(t=>`<div class="card row" style="justify-content:space-between;margin-bottom:9px;opacity:${t.done?.6:1}"><div class="row"><input aria-label="Taak afvinken" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><div><strong>${esc(t.text)}</strong><div class="muted small">${esc(t.date)} · ${esc(t.owner)}</div></div></div>${t.lead?`<button class="linkbtn" data-lead="${t.lead}">Bekijk lead →</button>`:''}</div>`).join('')}${sec('Afspraken','Alleen afspraken die door de boekingsprovider zijn bevestigd.')}<div class="card"><strong>Woensdag 15:00 — Kennismaking Lisa Bakker</strong><p class="note">Bevestigd door de boekingsprovider. <button class="linkbtn" data-lead="102">Bekijk aanvraag →</button></p></div>`}
function results(){return `${sec('Resultaten','Alle bedragen en conversies zijn fictieve demonstratiegegevens.')}${tag('Alleen Business Owner','info')}<div class="grid four" style="margin-top:15px"><div class="card"><div class="muted small">Aanvragen</div><div class="metric">38</div></div><div class="card"><div class="muted small">Afspraken</div><div class="metric">15</div></div><div class="card"><div class="muted small">Gewonnen deals</div><div class="metric">7</div></div><div class="card"><div class="muted small">Ontvangen betalingen</div><div class="metric">€ 2.450</div></div><div class="alert" style="margin-top:17px">CAC en LTV worden alleen getoond wanneer voldoende betrouwbare kosten- en omzetgegevens bekend zijn. Ontbrekende data wordt niet als €0 weergegeven.</div>`}
function settings(){return `${sec('Basisinstellingen','De ondernemer wijzigt zakelijke gegevens, geen technische AI-prompts.') }<div class="grid two"><div class="card stack"><div class="field"><label>Bedrijfsnaam</label><input value="NoordFit Coaching"></div><div class="field"><label>Boekingslink</label><input value="https://calendly.com/voorbeeld/kennismaking"></div>${button('Wijzigingen simuleren','saveSettings','')}</div><div class="card"><h2>Abonnement</h2><p>Conversion Engine Basis · €249/mnd</p><p class="muted small">Facturatie verloopt extern. Dit scherm toont alleen de status.</p>${tag('Actief','ok')}</div></div>`}
function support(){return `${sec('Support aanvragen','Een verzoek komt via dezelfde inbox binnen als support per e-mail.') }<div class="card" style="max-width:670px"><div class="stack"><div class="field"><label for="category">Onderwerp</label><select id="category"><option>Technisch probleem</option><option>Vraag</option><option>Websitewijziging</option></select></div><div class="field"><label for="description">Omschrijving</label><textarea id="description" rows="5" placeholder="Beschrijf je vraag of wijziging"></textarea></div><div class="well small">Organisatie en website worden automatisch gekoppeld. Structurele wijzigingen zijn mogelijk meerwerk en vereisen vooraf akkoord.</div>${button('Demonstreer versturen','submitSupport','')}</div></div>`}
function render(){if(isTeam()&&['results','settings'].includes(state.page))state.page='overview';renderNav();const titles={overview:'Overzicht',leads:'Leads & contacten',lead:'Leaddetail',pipeline:'Pipeline',deal:'Dealdetail',tasks:'Taken & afspraken',results:'Resultaten',settings:'Instellingen',support:'Support aanvragen'};$('#pageTitle').textContent=titles[state.page]||'Overzicht';$('#role').value=state.role;$('#roleMobile').value=state.role;$('#view').innerHTML=({overview,leads,lead:leadDetail,pipeline,deal:dealDetail,tasks,results,settings,support}[state.page]||overview)()}
function message(msg){let el=document.createElement('div');el.className='alert';el.textContent=msg;el.style.cssText='position:fixed;right:16px;bottom:16px;max-width:360px;z-index:20;box-shadow:0 12px 30px #20354025';document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);$('#mobileNav').classList.remove('open');$('#mobileRole').classList.remove('open');$('#mobileMenuToggle').setAttribute('aria-expanded','false');return;}let leadBtn=e.target.closest('[data-lead]');if(leadBtn){go('lead',leadBtn.dataset.lead);return;}let dealBtn=e.target.closest('[data-deal]');if(dealBtn){go('deal',dealBtn.dataset.deal);return;}let f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return;}let a=e.target.closest('[data-act]');if(!a)return;let act=a.dataset.act,l=db.leads.find(l=>l.id===state.leadId),d=db.deals.find(d=>d.id===state.dealId);switch(act){case'openleads':state.filter='action';go('leads');break;case'takeover':l.status='human';l.timeline.unshift(['Nu','Menselijke overname','Automatische opvolging is gestopt.']);render();message('Lead overgenomen; automatische opvolging gestopt.');break;case'newtask':db.tasks.unshift({id:Math.max(...db.tasks.map(t=>t.id))+1,lead:l.id,text:'Volg '+l.name+' persoonlijk op',owner:l.owner,date:'Vandaag',done:false});go('tasks');message('Voorbeeldtaak toegevoegd.');break;case'newdeal':{let id=Math.max(...db.deals.map(x=>x.id))+1;db.deals.push({id,lead:l.id,name:l.interest+' — '+l.name,phase:'Nieuw',value:0,recieved:0,owner:l.owner});l.hasDeal=true;go('deal',id);break;}case'viewdeal':go('deal',db.deals.find(x=>x.lead===l.id).id);break;case'savephase':d.phase=$('#phase').value;render();message('Pipelinefase aangepast in de demo.');break;case'payment':{let amount=Number($('#payment').value);if(!Number.isFinite(amount)||amount<=0){message('Voer een geldig bedrag in.');return;}d.recieved+=amount;render();message('Betaling geregistreerd in de demo; geen echte financiële transactie.');break;}case'saveSettings':message('Demo: instellingen niet opgeslagen op een server.');break;case'submitSupport':if(!$('#description').value.trim()){message('Vul eerst een omschrijving in.');return;}$('#description').value='';message('Voorbeeldverzoek verwerkt in de demo; er is geen e-mail verstuurd.');break;}});
document.addEventListener('change',e=>{if(e.target.id==='role'||e.target.id==='roleMobile'){state.role=e.target.value;go('overview');}let id=e.target.dataset.task;if(id){let t=db.tasks.find(t=>t.id===Number(id));t.done=e.target.checked;render();}});
document.addEventListener('input',e=>{if(e.target.id==='searchLeads'){let val=e.target.value.toLowerCase().trim();document.querySelectorAll('#leadRows tr').forEach(tr=>{if(tr.dataset.text)tr.style.display=tr.dataset.text.includes(val)?'':'none'})}});
$('#mobileMenuToggle').addEventListener('click',()=>{const on=$('#mobileNav').classList.toggle('open');$('#mobileRole').classList.toggle('open',on);$('#mobileMenuToggle').setAttribute('aria-expanded',String(on));});
$('#reset').addEventListener('click',()=>{db=data0();state={page:'overview',leadId:101,dealId:201,filter:'action',role:'owner'};render();message('Fictieve demo opnieuw ingesteld.')});
render();
})();
</script></body></html>
