function reviewBrief(id,r){const bits=briefDetails[id];const areas=[['business','01 · Bedrijf & identiteit','Q1 — Kickoff'],['audience','02 · Primaire doelgroep','Q2 — Doelgroep'],['offer','03 · Aanbod & conversie','Q3 — Aanbod'],['brand','04 · Branding & techniek','Q4 — Assets']];return `<div class="rv-panel"><div class="row between wrap"><div><h3>Gecombineerde Project Brief</h3><p>Bronantwoorden blijven herleidbaar naar hun vragenlijst. Geen AI-gegenereerde feiten.</p></div>${pill(r.approved?'Intern goedgekeurd':'Concept · ter beoordeling',r.approved?'good':'warn')}</div><div class="rv-qgrid">${areas.map(([k,title,subtitle])=>`<div class="rv-qcard"><div class="row between"><span class="rv-qtitle">${title}</span>${pill(r.qs[areas.findIndex(a=>a[0]===k)===0?'q1':areas.findIndex(a=>a[0]===k)===1?'q2':areas.findIndex(a=>a[0]===k)===2?'q3':'q4']?'Ingediend':'Ontbreekt',r.qs[areas.findIndex(a=>a[0]===k)===0?'q1':areas.findIndex(a=>a[0]===k)===1?'q2':areas.findIndex(a=>a[0]===k)===2?'q3':'q4']?'good':'bad')}</div><p>${subtitle}</p></div>`).join('')}</div>${areas.map(([key,title,subtitle])=>`<div class="rv-divider"></div><h3>${title}</h3><div class="rv-data">${bits[key].map(([label,value,source])=>`<div class="rv-dataitem"><span class="rv-dlabel">${safe(label)}</span><div class="rv-dvalue">${safe(value)}<span class="rv-source">Bron: ${safe(source)} · door klant aangeleverd · verificatie nog apart</span></div></div>`).join('')}</div>`).join('')}<div class="rv-divider"></div><div class="row wrap">${button('Controlepunten openen →','rvChecks')}${button('Project Brief als JSON','rvExport','secondary')}</div></div>`}
function reviewValidation(id,r){const complete=Object.values(r.qs).every(Boolean),checksOk=Object.values(r.checks).every(Boolean),canApprove=complete&&checksOk;return `<div class="rv-panel"><h3>Goedkeuringscontrole</h3><p>Alle vragenlijsten en vereiste verificaties moeten zijn afgerond. De goedkeuring is een menselijke beslissing.</p><div class="rv-qgrid">${[['Q1','Kickoff',r.qs.q1],['Q2','Doelgroep',r.qs.q2],['Q3','Aanbod',r.qs.q3],['Q4','Branding & assets',r.qs.q4]].map(([q,t,done])=>`<div class="rv-qcard"><div class="row between"><strong class="small">${q} · ${t}</strong>${pill(done?'Ingediend':'Ontbreekt',done?'good':'bad')}</div></div>`).join('')}</div>${!complete?`<div class="rv-blocker">Niet alle vragenlijsten zijn ingediend. Vraag alleen de ontbrekende gegevens op; automatisch goedkeuren is geblokkeerd.</div>`:''}<div class="subcard" style="margin-top:13px"><div class="row between wrap"><strong>Meerwerk & scope</strong>${pill(r.extras.decision==='pending'?'Besluit nodig':r.extras.decision==='quote_approved'?'Offerte geaccordeerd':r.extras.decision==='standard_only'?'Buiten scope':'Niet van toepassing',r.extras.decision==='pending'?'warn':'good')}</div><p class="small muted">${[r.extras.photography?'Professionele fotografie':null,r.extras.branding?'Nieuwe branding':null,r.extras.pages?'Extra pagina’s':null].filter(Boolean).join(' · ')||'Geen extra diensten aangevraagd'}</p>${r.extras.decision==='pending'?`<div class="row wrap">${button('Als meerwerk uitsluiten','rvScopeStandard','secondary')}${button('Offerte-akkoord simuleren','rvQuoteApprove','secondary')}</div>`:''}<p class="tiny muted">Meerwerk vereist een afzonderlijk voorstel en daadwerkelijke klantgoedkeuring. Deze demo simuleert alleen een scopebesluit.</p></div>${reviewChecks.map(([key,label,desc])=>`<div class="rv-check"><div><div class="row wrap"><strong>${label}</strong>${pill(r.checks[key]?'Gecontroleerd':'Controle vereist',r.checks[key]?'good':'warn')}</div><p>${desc}</p></div>${button(r.checks[key]?'Heropen':'Markeer gecontroleerd','rvToggleCheck','secondary',`data-id="${key}"`)}</div>`).join('')}<div class="rv-divider"></div><div class="field"><label for="rvNote">Gerichte terugkoppeling aan klant</label><textarea class="rv-notes" id="rvNote" placeholder="Welke informatie, onderbouwing of toestemming ontbreekt?">${safe(r.note)}</textarea><span class="tiny muted">Deze demo bewaart de tekst alleen tijdelijk in geheugen; er wordt geen e-mail verstuurd.</span></div><div class="row wrap" style="margin-top:12px">${button('Aanvulling vragen (demo)','rvRequest','secondary')}${button('Project Brief goedkeuren','rvApproveBrief',canApprove&&!r.approved?'':'secondary',r.approved||!canApprove?'disabled':'')}</div>${r.approved?`<div class="rv-ready" style="margin-top:14px">De intake is intern goedgekeurd op basis van Project Brief v${r.version}. Nieuwe klantwijzigingen maken deze goedkeuring ongeldig.</div>`:!canApprove?`<div class="rv-blocker">Goedkeuring geblokkeerd: ${!complete?'ontbrekende antwoorden':'openstaande controles'}. Sluit alle punten af vóór productie.</div>`:''}</div>`}
function reviewProduction(id,r){const complete=Object.values(r.qs).every(Boolean),checksOk=Object.values(r.checks).every(Boolean),gated=r.approved&&r.strategyApproved;const allqa=Object.values(r.qa).every(Boolean);return `<div class="rv-panel"><h3>Productie & vrijgave</h3><p>AI-mag ondersteunen, maar start niet zelfstandig. Strategie, inhoud en technische kwaliteit hebben afzonderlijke menselijke controles.</p><div class="subcard"><div class="row between wrap"><strong>Gate 1 — Project Brief & intake</strong>${pill(r.approved?'Goedgekeurd':'Geblokkeerd',r.approved?'good':'bad')}</div><p class="small muted">Vereist Q1–Q4 compleet, claims en rechten gecontroleerd, scope bevestigd.</p>${!r.approved?button('Ga naar controlepunten','rvChecks','secondary'):''}</div><div class="subcard" style="margin-top:10px"><div class="row between wrap"><strong>Gate A — Website- en conversiestrategie</strong>${pill(r.strategyApproved?'Goedgekeurd':r.approved?'Wacht op review':'Geblokkeerd',r.strategyApproved?'good':'warn')}</div><p class="small muted">Positionering, sitemap, CTA, één leadmagnet en scope moeten inhoudelijk zijn afgestemd. Dit prototype toont de gate, niet een echte strategie-agent.</p>${button('Strategie goedkeuren (demo)','rvApproveStrategy',!r.approved||r.strategyApproved?'secondary':'',!r.approved||r.strategyApproved?'disabled':'')}</div><div class="rv-divider"></div><h3>Productiestappen</h3><div class="steps">${reviewStages.map((label,i)=>`<span class="step ${i<r.stage?'done':i===r.stage?'current':''}">${i+1}. ${label}</span>`).join('')}</div><p class="small muted" style="margin-top:11px">De doorlooptijd is een interne doelstelling. Nieuwe componenten, branding en fotografie zijn geen automatische inbegrepen scope.</p>${r.stage===2&&gated?`<div class="row wrap" style="margin:15px 0">${button('Concept naar staging (demo)','rvToStaging')}</div>`:''}${r.stage===3&&gated?`<div class="row wrap" style="margin:15px 0">${button('Staging naar QA (demo)','rvToQA')}</div>`:''}${r.stage>=4?`<div class="rv-divider"></div><h3>Gate B — Inhoud en livegang</h3><p class="small muted">Voor livegang zijn klantakkoord en verifieerbare tests nodig.</p>${[['content','Copy en aanbod gecontroleerd'],['forms','Formulier & backendketen gecontroleerd'],['tracking','Analytics, events en privacy-instellingen gecontroleerd'],['accessibility','Mobiel, accessibility en performance gecontroleerd']].map(([key,label])=>`<div class="rv-qa"><label><input type="checkbox" data-review-qa="${key}" ${r.qa[key]?'checked':''}>${label}</label></div>`).join('')}<div class="rv-qa"><label><input type="checkbox" id="rvClientApproval" ${r.clientApproved?'checked':''}>Klant heeft schriftelijk akkoord gegeven op inhoud en aanbod</label></div><div class="row wrap" style="margin-top:15px">${button('Markeer klaar voor live (demo)','rvRelease',!allqa||!r.clientApproved?'secondary':'',!allqa||!r.clientApproved||r.stage===5?'disabled':'')}</div>${r.stage===5?`<div class="rv-ready" style="margin-top:13px">Alle demo-gates zijn akkoord. Klaar voor de afzonderlijke deploymentprocedure. Deze knop heeft geen website gepubliceerd.</div>`:!allqa||!r.clientApproved?`<div class="rv-blocker">Vrijgave niet mogelijk: controleer alle QA-punten en het klantakkoord.</div>`:''}`:''}${!r.approved?`<div class="rv-blocker" style="margin-top:16px">De AI-productie mag niet worden vrijgegeven: de Project Brief is nog niet goedgekeurd.</div>`:''}</div>`}
function reviewHistory(id,r){return `<div class="rv-panel"><h3>Audit & versies</h3><p>Fictief demo-overzicht. In productie worden beslissingen, gebruiker, tijdstip, versie en reden server-side vastgelegd.</p><div class="row wrap" style="margin:12px 0">${button('Simuleer nieuw klantantwoord','rvRevision','secondary')}${button('Download bronmetadata','rvExport','secondary')}</div><ul class="rv-log">${r.history.map(([time,event,detail])=>`<li><strong>${safe(event)}</strong><small>${safe(time)} · ${safe(detail)}</small></li>`).join('')}</ul></div>`}
function rvExport(){const id=state.reviewClient,r=rv(id);const blob=new Blob([JSON.stringify(rvSafeBrief(r,id),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`project-brief-demo-${id}-v${r.version}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Demo Project Brief gedownload. Alle gegevens zijn fictief.');}
function reviewAction(act,key){const id=state.reviewClient,r=rv(id);if(act==='rvExport'){rvExport();return;}if(act==='goIntake'){state.client=id;go('onboarding');return;}if(act==='rvChecks'){state.reviewTab='checks';render();return;}if(act==='rvToggleCheck'){if(key==='scope'&&r.extras.decision==='pending'){toast('Bepaal eerst of het aangevraagde meerwerk buiten scope valt of een akkoord op een aparte offerte heeft.');return;}r.checks[key]=!r.checks[key];if(r.approved&&!r.checks[key]){r.approved=false;r.strategyApproved=false;r.stage=0;rvLog(r,'Vrijgave ingetrokken','Controle heropend');}rvLog(r,r.checks[key]?'Controle afgevinkt':'Controle heropend',reviewChecks.find(x=>x[0]===key)?.[1]||key);render();return;}if(act==='rvScopeStandard'||act==='rvQuoteApprove'){if(!window.confirm(act==='rvScopeStandard'?'Zet extra wensen buiten de standaardwebsite?':'Simuleer dat een afzonderlijke offerte is goedgekeurd? Er wordt niets gefactureerd.'))return;r.extras.decision=act==='rvScopeStandard'?'standard_only':'quote_approved';r.checks.scope=true;rvLog(r,'Scopebesluit vastgelegd',act==='rvScopeStandard'?'Meerwerk apart; standaardwebsite kan door':'Offerteakkoord in demo; geen echte betalingshandeling');render();return;}if(act==='rvRequest'){r.note=document.querySelector('#rvNote')?.value.trim()||r.note;if(!r.note){toast('Schrijf eerst een concrete vraag aan de klant.');return;}rvLog(r,'Aanvulling gevraagd (demo)','Conceptbericht opgeslagen; er is geen e-mail verstuurd');r.status='Aanvulling nodig';r.approved=false;r.strategyApproved=false;r.stage=0;render();toast('Aanvulverzoek lokaal vastgelegd. Geen bericht verzonden.');return;}if(act==='rvApproveBrief'){if(!Object.values(r.qs).every(Boolean)||!Object.values(r.checks).every(Boolean)){toast('Niet toegestaan: er ontbreken intakeantwoorden of controles.');return;}if(!window.confirm(`Markeer Project Brief v${r.version} van ${rvName(id)} als intern goedgekeurd in deze demo?`))return;r.approved=true;r.stage=Math.max(r.stage,1);rvLog(r,'Intake & Project Brief goedgekeurd','Vaste bronversie · handmatige demobeslissing');render();return;}if(act==='rvApproveStrategy'){if(!r.approved){toast('Goedkeur eerst de Project Brief.');return;}r.strategyApproved=true;r.stage=Math.max(r.stage,2);rvLog(r,'Strategie en scope vrijgegeven','Gate A voltooid · demo');render();return;}if(act==='rvToStaging'){if(!r.approved||!r.strategyApproved||r.stage!==2)return;r.stage=3;rvLog(r,'Stagingconcept gereed','Demo, geen website gebouwd');render();return;}if(act==='rvToQA'){if(!r.approved||!r.strategyApproved||r.stage!==3)return;r.stage=4;rvLog(r,'QA gestart','Demo, tests niet uitgevoerd');render();return;}if(act==='rvRelease'){if(r.stage!==4||!r.approved||!r.strategyApproved||!r.clientApproved||!Object.values(r.qa).every(Boolean)){toast('Vrijgave geblokkeerd: check alle gates, QA en klantakkoord.');return;}if(!window.confirm('Markeer deze DEMO als klaar voor live? Er wordt niets gepubliceerd.'))return;r.stage=5;rvLog(r,'Klaar voor live','Alle democontroles afgevinkt · geen deployment');render();return;}if(act==='rvRevision'){if(!window.confirm('Simuleer dat een klant een intakeantwoord verandert? Eerdere vrijgaven vervallen.'))return;r.version++;r.approved=false;r.strategyApproved=false;r.stage=0;r.checks.claims=false;if(r.extras.decision!=='not_applicable'){r.extras.decision='pending';r.checks.scope=false;}r.qa={content:false,forms:false,tracking:false,accessibility:false};r.clientApproved=false;r.updated='17 oktober 2026';rvLog(r,'Project Brief v'+r.version+' gegenereerd','Klantwijziging → vorige gatebesluiten ongeldig');render();return;}}
/* ================== end review studio ================== */

function templates(){return `${section('Beheerde templates','Eén branche-onafhankelijke softwarekern met beperkte, gecontroleerde configuratie.')}<div class="grid three">${[['Personal trainer','Actief','Quiz, intakepipeline, eerste reactie'],['Coach','Concept','Kennismaking en trajectaanbod'],['Installateur','Concept','Offerte, inspectie en opdracht']].map(a=>`<div class="card"><h3>${a[0]}</h3>${pill(a[1])}<p class="small muted">${a[2]}</p></div>`).join('')}</div>${section('Componentbibliotheek','AI mag alleen goedgekeurde, versieerbare onderdelen inzetten.')}<div class="grid two">${[['Hero + CTA','v1.2','Goedgekeurd'],['Diensten & cases','v1.1','Goedgekeurd'],['Reviews','v1.2','Goedgekeurd'],['Leadmagnet wrapper','v0.9','In review']].map(x=>`<div class="component"><strong>${x[0]}</strong><p>${x[1]} · ${x[2]}</p></div>`).join('')}</div><div class="notice" style="margin-top:16px">Een nieuwe component vereist design review, mobiele toetsing, toegankelijkheid en regressietests. Referenties uit bestaande klantwebsites zijn een interne inspiratiebron, geen recht om hun foto's of copy over te nemen.</div>`}
function support(){return `${section('Support (MVP)','Twee manieren om verzoeken te ontvangen; één externe inbox.')}<div class="grid two"><div class="card stack"><h3>Supportkanalen</h3>${row('Support-e-mailadres','Bestaande supportinbox van Westend; daadwerkelijke mailbox buiten deze demo.',pill('Extern','info'))}${row('Formulier klantdashboard','Technisch probleem, vraag of websitewijziging. Tenantcontext automatisch.',pill('In MVP','good'))}<div class="notice">Er is nog geen interne ticketdatabase, AI-prioritering of takenplanner. Die komen na MVP.</div></div><div class="card stack"><h3>Wijzigingsverzoeken</h3><p class="small muted">Westend beoordeelt of het verzoek binnen de afgesproken scope valt. Structurele wijzigingen en nieuwe integraties zijn pas uitvoerbaar na offerte en akkoord.</p>${row('1. Verzoek ontvangen','Via supportmail of dashboardformulier',pill('Handmatig','info'))}${row('2. Scope beoordelen','Inbegrepen, bugfix of meerwerk',pill('Westend','info'))}${row('3. Meerwerk','Offerte en klantakkoord vóór uitvoering',pill('Goedkeuring','warn'))}</div></div>`}
function render(){drawNav();$('#pageTitle').textContent=titles[state.page]?.[0]||'Operations';$('#pageDesc').textContent=titles[state.page]?.[1]||'';$('#view').innerHTML=({operations,clients,client:clientDetail,onboarding,review:reviewStudio,websites,monitor,ai,intelligence,sources,templates,support}[state.page]||operations)()+`<p class="footerhint">UX-wireframe v0.3 · uitsluitend fictieve gegevens · geen echte toegang, meting, test, e-mail of deployment. Alle productieacties vereisen later backend-autorisatie en audit.</p>`}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),4500)}
function run(action,id){if(action.startsWith('rv')||action==='goIntake'){reviewAction(action,id);return;}switch(action){case'toReview':go('review');break;case'toClients':go('clients');break;case'toWebsites':go('websites');break;case'toSources':go('sources');break;case'toIntelligence':go('intelligence');break;case'toRecordings':state.intelTab='recordings';go('intelligence');break;case'toRecommendations':state.intelTab='recommendations';go('intelligence');break;case'openClarity':toast('Demo: open hier later de werkelijke Clarity-project-URL na autorisatie; deze versie heeft geen live link.');break;case'recordingDemo':toast('Fictieve opname. In productie opent uitsluitend een bestaande, geautoriseerde Clarity-deellink of het Clarity-project.');break;case'adviceEvidence':toast('Demo: aanbeveling gebaseerd op meerdere databronnen. Exact bewijs volgt uit echte koppelingen.');break;case'adviceReview':toast('Demo: advies gemarkeerd voor Westend-review, er wordt niets gepubliceerd.');break;case'openOnboarding':state.client=id;go('onboarding');break;case'openMonitoring':go('monitor');break;case'incident':state.monitorTab='incidents';go('monitor');break;case'addClient':toast('Nieuwe accounts worden in de MVP via een beperkte provisioningflow aangemaakt. Deze demo maakt geen account aan.');break;case'saveSubscription':client(state.client).subscription=$('#subscription').value;render();toast('Voorbeeldstatus lokaal aangepast; geen facturatie of betaling uitgevoerd.');break;case'completeIntake':{const a=model.approvals[state.client]??(model.approvals[state.client]={q1:false,q2:false,q3:false,q4:false});Object.keys(a).forEach(x=>a[x]=true);client(state.client).onboarding='In behandeling';render();toast('Demo: alle intakeonderdelen op compleet gezet.');break;}case'approveStrategy':{const a=model.approvals[state.client];if(!a||Object.values(a).some(v=>!v)){toast('Niet toegestaan: intake is nog niet compleet.');break;}state.feedback='Strategie in de demo gemarkeerd als intern goedgekeurd. Klantinhoud en QA blijven een afzonderlijke gate.';render();toast('Demogoedkeuring verwerkt.');break;}case'launchChecklist':toast('Livegangchecks: inhoud akkoord, assetrechten, toegankelijkheid, leadroute, formuliertest, domein en tracking. Geen echte deployment.');break;case'investigate':model.incidents.find(i=>i.id==id).status='In onderzoek';render();toast('Incident in behandeling; geen technische test uitgevoerd.');break;case'resolve':model.incidents.find(i=>i.id==id).status='Opgelost';render();toast('Demo: incident als opgelost gemarkeerd, zonder echte herstelverificatie.');break;case'toggleAi':{const next=!model.autoresponse[id];const verb=next?'activeren':'pauzeren';if(window.confirm(`Demo: AI-reacties ${verb} voor ${name(id)}? Geldige aanvragen blijven opgeslagen; bij pauze gaat opvolging naar een medewerker.`)){model.autoresponse[id]=next;render();toast('AI-status aangepast in de demo, niet op een server.');}break;}}}
document.addEventListener('click',e=>{const navbutton=e.target.closest('[data-page]');if(navbutton){const p=navbutton.dataset.page;if(p.startsWith('client:'))go('client',p.split(':')[1]);else go(p);$('#mobileNav').classList.remove('open');$('#mobileToggle').setAttribute('aria-expanded','false');return;}const it=e.target.closest('[data-intel-tab]');if(it){state.intelTab=it.dataset.intelTab;render();return;}const rc=e.target.closest('[data-review-client]');if(rc){state.reviewClient=rc.dataset.reviewClient;state.reviewTab='brief';render();return;}const rt=e.target.closest('[data-review-tab]');if(rt){state.reviewTab=rt.dataset.reviewTab;render();return;}const mt=e.target.closest('[data-monitor-tab]');if(mt){state.monitorTab=mt.dataset.monitorTab;render();return;}const act=e.target.closest('[data-act]');if(act)run(act.dataset.act,act.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id==='rvNote'){rv(state.reviewClient).note=e.target.value;}});document.addEventListener('change',e=>{const id=e.target.id;if(e.target.dataset.reviewQa){const r=rv(state.reviewClient);r.qa[e.target.dataset.reviewQa]=e.target.checked;rvLog(r,'QA-controle gewijzigd',e.target.dataset.reviewQa+' = '+e.target.checked);render();return;}if(id==='rvClientApproval'){const r=rv(state.reviewClient);r.clientApproved=e.target.checked;rvLog(r,'Klantinhoudakkoord bijgewerkt',e.target.checked?'Akkoord bevestigd (demo)':'Akkoord ingetrokken');render();return;}if(id==='onboardClient'){state.client=e.target.value;state.feedback='';render()}if(id==='siteClient'){state.site=e.target.value;render()}if(id==='sourceClient'){state.sourceClient=e.target.value;render()}if(id==='intelClient'){state.intelClient=e.target.value;render()}if(id==='intelRange'){state.intelRange=e.target.value;render()}});
$('#mobileToggle').addEventListener('click',()=>{const open=$('#mobileNav').classList.toggle('open');$('#mobileToggle').setAttribute('aria-expanded',String(open));});$('#reset').addEventListener('click',()=>{model=initial();state={page:'review',client:'nf',monitorTab:'incidents',site:'nf',sourceClient:'nf',pending:null,feedback:'',intelClient:'nf',intelTab:'overview',intelRange:'30',reviewClient:'nf',reviewTab:'brief'};render();toast('Demo hersteld naar fictieve uitgangsgegevens.')});render();
})();
</script></body></html>
