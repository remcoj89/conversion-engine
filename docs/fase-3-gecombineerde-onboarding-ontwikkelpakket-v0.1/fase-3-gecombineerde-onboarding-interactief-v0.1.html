_for_westend_review'?'Klaar voor review':'Incompleet'}</b></div><div class="neutral">Gestructureerde input voor Strategie, SEO/GEO, Copywriting, Design en Development. Geen AI-hallucinaties of automatische publicatie.</div><button class="btn" style="margin-top:15px;width:100%" id="previewJSON">Bekijk technische mapping</button></div></div><div class="card"><div class="card-body"><h3>Wat gebeurt er na indienen?</h3><p class="micro">Intakecontrole → extra vragen of scopebesluit → menselijke strategiecheck → content/design/build → QA en goedkeuring.</p></div></div></div></div><section class="card" id="jsonsection" style="margin-top:18px;display:none"><div class="card-body"><h2>Project Brief · concept-JSON</h2><p class="micro">Voorbeeld met ingevulde waarden. Het projectdossier bewaart per waarde de bronvraag en reviewstatus.</p><pre style="font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:500px;overflow:auto">${esc(JSON.stringify(data,null,2))}</pre></div></section>`;
