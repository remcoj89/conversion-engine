/* Responsive improvements in wireframe v0.3: usable cards rather than clipped tables. */
.mobileMenuToggle,.mobile-role,.mobile-pipeline{display:none}
.mobile-deal{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px;display:grid;gap:5px;color:var(--ink)}
.mobile-phase{margin-bottom:15px}
.mobile-phase h3{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 8px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #62a6c3;outline-offset:2px}
@media(max-width:720px){
.mobileMenuToggle{display:block;margin:7px 4px;width:calc(100% - 8px);padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#225a72;text-align:left;font-weight:700}
.mobilebar{display:none;overflow:visible;flex-direction:column;gap:6px;padding:7px 3px 10px}
.mobilebar.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.mobilebar button{white-space:normal;text-align:left;min-height:42px}
.mobile-role{display:none;padding:8px 5px 12px}.mobile-role.open{display:block}.mobile-role select{width:100%}.mobile-role .hint{font-size:11px;color:var(--muted)}
.tablewrap{overflow:visible;background:transparent;border:0}
.tablewrap table{min-width:0;width:100%;display:block}
.tablewrap thead{display:none}
.tablewrap tbody{display:grid;gap:9px}
.tablewrap tbody tr{display:block;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.tablewrap tbody tr td{display:flex;padding:9px 12px;border-bottom:1px solid #edf0f2;justify-content:space-between;gap:14px;text-align:right;word-break:break-word}
.tablewrap tbody tr td:last-child{border-bottom:0;justify-content:flex-end}
.tablewrap tbody tr td:first-child{display:block;text-align:left;padding:12px}
.tablewrap td::before{font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:650;white-space:nowrap;text-align:left}
.attention-table td:nth-child(2)::before{content:'Aanvraag'}
.attention-table td:nth-child(3)::before{content:'Status'}
.leads-table td:nth-child(2)::before{content:'Interesse'}
.leads-table td:nth-child(3)::before{content:'Bron'}
.leads-table td:nth-child(4)::before{content:'Eigenaar'}
.leads-table td:nth-child(5)::before{content:'Status'}
.tablewrap tbody tr td[colspan]{display:block;text-align:center}
.pipeline{display:none}
.mobile-pipeline{display:block}
.row{min-width:0}
}

ound:#f8fbfc}.choice-toggle input{margin-top:4px;flex-shrink:0}
@media(max-width:720px){.rec .rec-top{display:block}.source-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.source-tag{justify-content:center;text-align:center}.performance-chart{height:115px}.tabs button{flex:1}.mini-table{display:table!important}.mini-table thead{display:table-header-group!important}.mini-table tbody{display:table-row-group!important}.mini-table tbody tr{display:table-row!important;border:0!important}.mini-table tbody tr td{display:table-cell!important;text-align:left!important;padding:10px 6px!important}.mini-table td:before{content:none!important}.mini-table th{padding:9px 6px!important}}

<body><div class="app"><aside class="side"><div class="brand">westend<span style="color:#758994">.</span><small>CONVERSION ENGINE · WIREFRAME</small></div><button class="mobileMenuToggle" id="mobileMenuToggle" aria-expanded="false" aria-controls="mobileNav">☰ Menu en schermen</button><nav class="nav navgroup" id="nav"></nav><div class="mobilebar" id="mobileNav"></div><div class="mobile-role" id="mobileRole"><label for="roleMobile">Test gebruikersrol</label><select id="roleMobile"><option value="owner">Business Owner</option><option value="team">Team Member</option></select><p class="hint">Interactieve demo met fictieve gegevens; geen backend.</p></div><div class="sidefoot"><label for="role">Voorbeeldrol</label><select id="role"><option value="owner">Business Owner</option><option value="team">Team Member</option></select><div class="hint">Demo zonder backend. Wijzigingen zijn tijdelijk en gebruiken fictieve gegevens.</div><button class="btn secondary" id="reset">Demo resetten</button></div></aside><div class="main"><header class="header"><div><div class="heading" id="pageTitle">Overzicht</div><small>Fictieve organisatie: NoordFit Coaching · Wireframe v0.4</small></div><div class="toolbar"><span class="tag info">Prototype</span><button class="btn secondary" data-nav="support">Support aanvragen</button></div></header><main id="view" class="content"></main></div></div>

(()=>{'use strict';

'Medewerker',date:'Vandaag',done:false},{id:303,lead:102,text:'Bereid intake met Lisa voor',owner:'Eigenaar',date:'Morgen',done:false}]});

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isTeam=()=>state.role==='team';const maySeeDealValue=()=>!isTeam()||state.teamDealValues;const mine=l=>!isTeam()||l.owner==='Medewerker';const allowedLead=()=>db.leads.filter(mine);const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);const tag=(s,cls='')=>`<span class="tag ${cls}">${s}</span>`;const button=(label,act,cls='secondary')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;

${sec('Direct opvolgen','Gesorteerd op benodigde actie.',button('Alle aanvragen bekijken','openleads'))}

${!isTeam()?`${sec('Websiteprestaties & advies','Google Analytics, Search Console, Clarity en DataForSEO — fictieve demo.',`<button class="btn secondary" data-nav="performance">Bekijk prestaties en advies →</button>`)}<div class="grid three"><div class="card clickable" data-nav="performance"><div class="muted small">Websitebezoekers (GA4)</div><div class="metric">2.486</div>${tag('Voorbeelddata','info')}</div><div class="card clickable" data-nav="performance"><div class="muted small">Organische klikken (GSC)</div><div class="metric">712</div><span class="subtle-delta">+12% in voorbeeldperiode</span></div><div class="card clickable" data-nav="performance"><div class="muted small">Open advieskansen</div><div class="metric">4</div>${tag('Advies, geen automatische uitvoering')}</div></div>`:''}

function downloadAdviceReport(){const p=performanceData[state.period], body=['# Voorbeeld maandadviesrapport — NoordFit Coaching','', '**LET OP: ALLE DATA IN DIT RAPPORT IS FICTIEF (UX-PROTOTYPE)**','',`Periode: ${state.period} dagen`,'','## Resultaten',`- GA4 actieve gebruikers (demo): ${p.users}`,`- GSC organische klikken (demo): ${p.clicks}`,`- GSC gemiddelde CTR (demo): ${p.ctr}`,`- CRM aanvragen (demo): ${p.events}`,`- DataForSEO LLM vermeldingen (demo, steekproef): ${p.mentions}`,'','## Adviezen',...advice.flatMap((a,i)=>[`${i+1}. ${a.title}`,`   - Signaal: ${a.evidence}`,`   - Hypothese: ${a.assumption}`,`   - Volgende stap: ${a.action}`,'']),'## Beperkingen','Zoekvolume is een schatting; AI-vermeldingen zijn steekproeven; Clarity-signalen vereisen handmatige interpretatie. Geen wijzigingen zijn uitgevoerd.'].join('\n');const blob=new Blob([body],{type:'text/markdown;charset=utf-8'});const href=URL.createObjectURL(blob),link=document.createElement('a');link.href=href;link.download='voorbeeld-maandadvies-noordfit.md';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),1000)}

function settings(){return `${sec('Basisinstellingen','De ondernemer wijzigt zakelijke gegevens, geen technische AI-prompts.') }<div class="grid two"><div class="card stack"><div class="field"><label>Bedrijfsnaam</label><input value="NoordFit Coaching"></div><div class="field"><label>Boekingslink</label><input value="https://calendly.com/voorbeeld/kennismaking"></div><div class="choice-toggle"><input id="teamDealValues" type="checkbox" ${state.teamDealValues?'checked':''}><div><label for="teamDealValues">Medewerkers mogen de waarde van hun eigen deals zien</label><p class="note" style="margin:0">Niet de betalingen of omzet van het hele bedrijf. Standaard uit.</p></div></div>${button('Wijzigingen simuleren','saveSettings','')}</div><div class="card"><h2>Abonnement</h2><p>Conversion Engine Basis · €249/mnd</p><p class="muted small">Facturatie verloopt extern. Dit scherm toont alleen de status.</p>${tag('Actief','ok')}</div></div>`}
function support(){return `${sec('Support aanvragen','Een verzoek komt via dezelfde inbox binnen als support per e-mail.') }<div class="card" style="max-width:670px"><div class="stack"><div class="field"><label for="category">Onderwerp</label><select id="category"><option>Technisch probleem</option><option>Vraag</option><option ${state.supportPrefill?'selected':''}>Websitewijziging</option></select></div><div class="field"><label for="description">Omschrijving</label><textarea id="description" rows="5" placeholder="Beschrijf je vraag of wijziging">${esc(state.supportPrefill)}</textarea></div><div class="well small">Organisatie en website worden automatisch gekoppeld. Structurele wijzigingen zijn mogelijk meerwerk en vereisen vooraf akkoord.</div>${button('Demonstreer versturen','submitSupport','')}</div></div>`}
function render(){if(isTeam()&&['results','performance','settings'].includes(state.page))state.page='overview';renderNav();const titles={overview:'Overzicht',leads:'Leads & contacten',lead:'Leaddetail',pipeline:'Pipeline',deal:'Dealdetail',tasks:'Taken & afspraken',results:'Resultaten',performance:'Websiteprestaties & advies',settings:'Instellingen',support:'Support aanvragen'};$('#pageTitle').textContent=titles[state.page]||'Overzicht';$('#role').value=state.role;$('#roleMobile').value=state.role;$('#view').innerHTML=({overview,leads,lead:leadDetail,pipeline,deal:dealDetail,tasks,results,performance,settings,support}[state.page]||overview)()}
function message(msg){let el=document.createElement('div');el.className='alert';el.textContent=msg;el.style.cssText='position:fixed;right:16px;bottom:16px;max-width:360px;z-index:20;box-shadow:0 12px 30px #20354025';document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);$('#mobileNav').classList.remove('open');$('#mobileRole').classList.remove('open');$('#mobileMenuToggle').setAttribute('aria-expanded','false');return;}let leadBtn=e.target.closest('[data-lead]');if(leadBtn){go('lead',leadBtn.dataset.lead);return;}let dealBtn=e.target.closest('[data-deal]');if(dealBtn){go('deal',dealBtn.dataset.deal);return;}let f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return;}let pt=e.target.closest('[data-perftab]');if(pt){state.perfTab=pt.dataset.perftab;render();return;}let rec=e.target.closest('[data-rec]');if(rec){state.recOpen=state.recOpen===Number(rec.dataset.rec)?0:Number(rec.dataset.rec);render();return;}let req=e.target.closest('[data-request]');if(req){const item=advice.find(a=>a.id===Number(req.dataset.request));state.supportPrefill='Ik wil deze aanbeveling bespreken: '+item.title+'\nVoorgestelde aanpak: '+item.action;go('support');return;}let a=e.target.closest('[data-act]');if(!a)return;let act=a.dataset.act,l=db.leads.find(l=>l.id===state.leadId),d=db.deals.find(d=>d.id===state.dealId);switch(act){case'report':downloadAdviceReport();message('Voorbeeldrapport (met fictieve data) gedownload.');break;case'openleads':state.filter='action';go('leads');break;case'takeover':l.status='human';l.timeline.unshift(['Nu','Menselijke overname','Automatische opvolging is gestopt.']);render();message('Lead overgenomen; automatische opvolging gestopt.');break;case'newtask':db.tasks.unshift({id:Math.max(...db.tasks.map(t=>t.id))+1,lead:l.id,text:'Volg '+l.name+' persoonlijk op',owner:l.owner,date:'Vandaag',done:false});go('tasks');message('Voorbeeldtaak toegevoegd.');break;case'newdeal':{let id=Math.max(...db.deals.map(x=>x.id))+1;db.deals.push({id,lead:l.id,name:l.interest+' — '+l.name,phase:'Nieuw',value:0,recieved:0,owner:l.owner});l.hasDeal=true;go('deal',id);break;}case'viewdeal':go('deal',db.deals.find(x=>x.lead===l.id).id);break;case'savephase':d.phase=$('#phase').value;render();message('Pipelinefase aangepast in de demo.');break;case'payment':{let amount=Number($('#payment').value);if(!Number.isFinite(amount)||amount<=0){message('Voer een geldig bedrag in.');return;}d.recieved+=amount;render();message('Betaling geregistreerd in de demo; geen echte financiële transactie.');break;}case'saveSettings':message('Demo: instellingen niet opgeslagen op een server.');break;case'submitSupport':if(!$('#description').value.trim()){message('Vul eerst een omschrijving in.');return;}$('#description').value='';state.supportPrefill='';message('Voorbeeldverzoek verwerkt in de demo; er is geen e-mail verstuurd.');break;}});
document.addEventListener('change',e=>{if(e.target.id==='period'){state.period=e.target.value;render();return;}if(e.target.id==='teamDealValues'&&!isTeam()){state.teamDealValues=e.target.checked;render();message('Demoinstelling aangepast; in productie worden rechten server-side gecontroleerd.');return;}if(e.target.id==='role'||e.target.id==='roleMobile'){state.role=e.target.value;go('overview');}let id=e.target.dataset.task;if(id){let t=db.tasks.find(t=>t.id===Number(id));t.done=e.target.checked;render();}});
document.addEventListener('input',e=>{if(e.target.id==='searchLeads'){let val=e.target.value.toLowerCase().trim();document.querySelectorAll('#leadRows tr').forEach(tr=>{if(tr.dataset.text)tr.style.display=tr.dataset.text.includes(val)?'':'none'})}});
$('#mobileMenuToggle').addEventListener('click',()=>{const on=$('#mobileNav').classList.toggle('open');$('#mobileRole').classList.toggle('open',on);$('#mobileMenuToggle').setAttribute('aria-expanded',String(on));});
$('#reset').addEventListener('click',()=>{db=data0();state={page:'overview',leadId:101,dealId:201,filter:'action',role:'owner',teamDealValues:false,perfTab:'overview',period:'30',recOpen:0,supportPrefill:''};render();message('Fictieve demo opnieuw ingesteld.')});
render();
})();
</script></body></html>
